name: Bug Report
description: 报告一个 bug
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "感谢你花时间报告问题！请填写以下信息帮助我们快速定位。"
  - type: textarea
    id: description
    attributes:
      label: "问题描述"
      description: "清晰描述你遇到的问题"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "详细的复现步骤"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期望行为"
      description: "你期望发生什么？"
  - type: textarea
    id: actual
    attributes:
      label: "实际行为"
      description: "实际发生了什么？"
  - type: input
    id: version
    attributes:
      label: "版本"
      placeholder: "e.g. v0.1.0-alpha"
  - type: textarea
    id: environment
    attributes:
      label: "环境信息"
      description: "OS, Browser, Python 版本等"
  - type: textarea
    id: additional
    attributes:
      label: "附加信息"
      description: "截图、日志等"
